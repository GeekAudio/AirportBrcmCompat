<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1390" viewBox="0 0 1440 1390" role="img">
<rect width="1440" height="1390" fill="#f5f7fb"/>
<text x="52" y="80" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="44" font-weight="700" fill="#183047">解压后，文件这样放</text>
<text x="52" y="128" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="400" fill="#53657b">先放 kext 文件夹，再把 Wi-Fi 配置加进你现有的 config.plist。</text>
<rect x="48" y="168" width="1344" height="598" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
<text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="32" font-weight="700" fill="#183047">① 复制到 EFI/OC/Kexts/，文件夹保持原名</text>
<rect x="80" y="252" width="1280" height="56" rx="10" fill="#f5f8fd" stroke="#f5f8fd" stroke-width="2"/>
<text x="100" y="289" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">AirportBrcmCompat.kext</text>
<text x="1050" y="289" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">来自 RELEASE</text>
<rect x="80" y="318" width="1280" height="56" rx="10" fill="#f5f8fd" stroke="#f5f8fd" stroke-width="2"/>
<text x="100" y="355" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">IOLegacyWFamily.kext</text>
<text x="1050" y="355" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">来自必装配套</text>
<rect x="80" y="384" width="1280" height="56" rx="10" fill="#f5f8fd" stroke="#f5f8fd" stroke-width="2"/>
<text x="100" y="421" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">IO80211FamilyLegacy.kext</text>
<text x="1050" y="421" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">来自必装配套</text>
<rect x="80" y="450" width="1280" height="56" rx="10" fill="#f5f8fd" stroke="#f5f8fd" stroke-width="2"/>
<text x="100" y="487" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">AirPortBrcmNIC-Sonoma-Sequoia.kext</text>
<text x="1050" y="487" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">来自必装配套</text>
<rect x="80" y="516" width="1280" height="56" rx="10" fill="#f5f8fd" stroke="#f5f8fd" stroke-width="2"/>
<text x="100" y="553" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">AirPortBrcmNIC-Tahoe.kext</text>
<text x="1050" y="553" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">来自必装配套</text>
<rect x="80" y="598" width="1280" height="58" rx="10" fill="#fff9ed" stroke="#f1d8a8" stroke-width="2"/>
<text x="100" y="637" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#183047">AirportBrcmFixup.kext</text>
<text x="800" y="637" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#935009">仅 BCM43225／BCM4352 补充包</text>
<text x="80" y="702" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="600" fill="#1d4ed8">两个 AirPortBrcmNIC 文件夹都放进去，启动时会按系统选择一个。</text>
<text x="80" y="741" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">Sonoma / Sequoia 选前一个；Tahoe 选后一个。</text>
<rect x="48" y="800" width="1344" height="384" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
<text x="80" y="852" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="32" font-weight="700" fill="#183047">② 把配置加进现有 EFI/OC/config.plist</text>
<text x="80" y="905" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="600" fill="#2563eb">必装配套 / Examples</text>
<text x="80" y="947" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#183047">config-WiFi-RELEASE.example.plist</text>
<text x="840" y="947" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#183047">→ 加入其中的 Kernel 配置</text>
<text x="80" y="986" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#53657b">使用 DEBUG 时，选同目录的 DEBUG 配置文件。</text>
<text x="80" y="1034" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="600" fill="#935009">BCM43225／BCM4352 补充包</text>
<text x="80" y="1076" font-family="Menlo, Consolas, monospace" font-size="25" font-weight="400" fill="#183047">config.additional-cards.plist</text>
<text x="840" y="1076" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#183047">→ 添加两个加载条目</text>
<text x="80" y="1130" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#53657b">补充包的两项放在两个 AirPortBrcmNIC 条目前；内部插件排在主组件后。</text>
<rect x="48" y="1220" width="1344" height="124" rx="22" fill="#eaf1ff" stroke="#eaf1ff" stroke-width="2"/>
<text x="80" y="1270" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="31" font-weight="700" fill="#1d4ed8">③ 检查文件和配置无误后，再更新使用中的 EFI</text>
<text x="80" y="1318" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">先备份现有 EFI；添加 Wi-Fi 配置时，保留原来的其他设置。</text>
</svg>
