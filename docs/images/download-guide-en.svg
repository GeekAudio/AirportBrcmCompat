<text x="89" y="229" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="700" fill="#2563eb">01</text>
<text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="34" font-weight="700" fill="#183047">RELEASE</text>
<text x="80" y="338" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">The main Wi-Fi driver</text>
<rect x="628" y="174" width="516" height="270" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
<rect x="652" y="198" width="54" height="44" rx="12" fill="#eaf1ff" stroke="#eaf1ff" stroke-width="2"/>
<text x="661" y="229" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="700" fill="#2563eb">02</text>
<text x="652" y="290" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="31" font-weight="700" fill="#183047">Required Wi-Fi files</text>
<text x="652" y="338" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">Install with RELEASE</text>
<text x="80" y="394" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#183047">AirportBrcmCompat.kext</text>
<text x="652" y="386" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#183047">4 kext folders</text>
<text x="652" y="423" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#183047">+ Wi-Fi configuration files</text>
