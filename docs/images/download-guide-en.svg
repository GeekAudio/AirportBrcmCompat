<text x="84" y="634" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="31" font-weight="700" fill="#935009">BCM43225 / BCM4352: also download the add-on</text>
<text x="84" y="684" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#183047">Adds driver matching for these two card families.</text>
