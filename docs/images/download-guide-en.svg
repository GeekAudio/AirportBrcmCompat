<text x="56" y="78" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="44" font-weight="700" fill="#183047">Which files do I need?</text>
<text x="56" y="126" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="400" fill="#53657b">Everyday setup: download RELEASE + Required Wi-Fi files.</text>
<rect x="56" y="174" width="516" height="270" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
