<text x="84" y="858" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="31" font-weight="700" fill="#183047">DEBUG: use when troubleshooting</text>
<text x="84" y="907" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="25" font-weight="400" fill="#53657b">Replaces RELEASE. Keep the required Wi-Fi files installed.</text>
<text x="56" y="1000" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="23" font-weight="400" fill="#64748b">Check the compatibility table for your model and PCI ID.</text>
