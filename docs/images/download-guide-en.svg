<text x="88" y="516" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="600" fill="#1d4ed8">Extract both ZIPs, then follow the file layout below.</text>
