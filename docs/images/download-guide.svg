<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img">
<rect width="1200" height="1030" fill="#f5f7fb"/>
<text x="56" y="78" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="44" font-weight="700" fill="#183047">先下载哪几份？</text>
<text x="56" y="126" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="400" fill="#53657b">正常安装：RELEASE ＋ 必装配套，两份一起装。</text>
<rect x="56" y="174" width="516" height="270" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
<rect x="80" y="198" width="54" height="44" rx="12" fill="#eaf1ff" stroke="#eaf1ff" stroke-width="2"/>
<text x="89" y="229" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="700" fill="#2563eb">01</text>
<text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="36" font-weight="700" fill="#183047">RELEASE</text>
<text x="80" y="338" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">Wi-Fi 主驱动</text>
<rect x="628" y="174" width="516" height="270" rx="22" fill="#ffffff" stroke="#dce4ef" stroke-width="2"/>
<rect x="652" y="198" width="54" height="44" rx="12" fill="#eaf1ff" stroke="#eaf1ff" stroke-width="2"/>
<text x="661" y="229" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="700" fill="#2563eb">02</text>
<text x="652" y="290" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="36" font-weight="700" fill="#183047">必装配套</text>
<text x="652" y="338" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">和主驱动一起安装</text>
<text x="80" y="394" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="21" font-weight="400" fill="#183047">包含 AirportBrcmCompat.kext</text>
<text x="652" y="386" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#183047">包含 4 个 kext 文件夹</text>
<text x="652" y="423" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#183047">以及对应的 Wi-Fi 配置文件</text>
<rect x="56" y="472" width="1088" height="70" rx="16" fill="#eaf1ff" stroke="#eaf1ff" stroke-width="2"/>
<text x="88" y="516" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="27" font-weight="600" fill="#1d4ed8">解压这两份包，再按下一张图放文件、添加配置。</text>
<rect x="56" y="582" width="1088" height="190" rx="22" fill="#fff9ed" stroke="#f1d8a8" stroke-width="2"/>
<text x="84" y="634" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="31" font-weight="700" fill="#935009">BCM43225／BCM4352：再加一份补充包</text>
<text x="84" y="684" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#183047">给这两类卡补上驱动识别信息。其他表内型号不用装。</text>
<text x="84" y="733" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="24" font-weight="400" fill="#68573e">里面是 AirportBrcmFixup.kext 和对应的配置文件。</text>
<rect x="56" y="808" width="1088" height="142" rx="22" fill="#edf1f6" stroke="#dce4ef" stroke-width="2"/>
<text x="84" y="858" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="30" font-weight="700" fill="#183047">DEBUG：遇到问题、需要收集日志时再用</text>
<text x="84" y="907" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="26" font-weight="400" fill="#53657b">它替换 RELEASE；必装配套仍然要安装。</text>
<text x="56" y="1000" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="23" font-weight="400" fill="#64748b">适用网卡以兼容表中的型号和 PCI ID 为准。</text>
</svg>
