name: Offline validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Prepare pinned build resources
        run: python3 tools/prepare_dependencies.py
      - name: Prepare all external test inputs
        run: |
          python3 tools/prepare_test_fixtures.py
          python3 tools/prepare_runtime.py
      - name: Check published source and binary hashes
        run: shasum -a 256 --check SHA256SUMS.txt
      - name: Inspect selected host SDK
        run: |
          xcode-select -p
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-path
      - name: Check hardware-record integrity (no hardware tests executed)
        run: python3 tools/runtime_evidence.py
      - name: Run public offline tests
        run: |
          set -o pipefail
          python3 tools/run_tests.py --require-all 2>&1 | tee offline-tests.log
      - name: Build RELEASE
        run: python3 tools/build_unified_kernel.py --release --build-flavor RELEASE --output build/ci-RELEASE.zip
      - name: Build DEBUG
        run: python3 tools/build_unified_kernel.py --release --baseline-trace --control-rx-windows --build-flavor DEBUG --output build/ci-DEBUG.zip
      - name: Build one common Wi-Fi dependency set
        run: |
          python3 tools/unify_wifi_dependencies.py \
            --sonoma build/compatibility-profiles/sonoma14-dependencies.zip \
            --sequoia build/compatibility-profiles/sequoia15-dependencies.zip \
            --tahoe build/compatibility-profiles/tahoe26-dependencies.zip \
            --output build/ci-dependencies.zip
          python3 tools/prepare_broadcom_injector.py \
            --archive build/research/AirportBrcmFixup-2.2.1-RELEASE.zip \
            --dependency-profile automatic --output build/ci-additional.zip
      - name: Assemble complete versioned distribution
        run: |
          python3 tools/package_release.py \
            --release-core build/ci-RELEASE.zip --debug-core build/ci-DEBUG.zip \
            --dependencies build/ci-dependencies.zip --additional-cards build/ci-additional.zip \
            --runtime build/research/Lilu-1.7.2-RELEASE.zip \
            --test-log offline-tests.log --output build/distribution
      - name: Preserve test log and signed build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.os }}
          path: |
            offline-tests.log
            build/ci-*.zip
            build/distribution/**
          if-no-files-found: warn
